name = "nexus-gateway"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "NexusGateway"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NexusGateway"]

[[d1_databases]]
binding = "PULSESYNC_DB"
database_name = "pulsesync"
database_id = "02100d4e-3f3c-4679-a989-8fc2333ff1de"

[[services]]
binding = "CONTINUITY"
service = "continuity-worker"

[[services]]
binding = "DISCORD"
service = "discord-companion-bot"

[[services]]
binding = "TELEGRAM"
service = "telegram-cloud"

[[services]]
binding = "TAHL"
service = "velastrahq-tahl"

[[services]]
binding = "ARCHIVE"
service = "archive-worker"

[[services]]
binding = "CATALOUGE"
service = "catalouge-api"

[[services]]
binding = "SERYTHRAE_GATEWAY"
service = "serythrae-gw"
environment = "production"

[[services]]
binding = "SERYTHRAE_MIND"
service = "serythrae-nesteq"

[[services]]
binding = "TESSURAE_GATEWAY"
service = "tessurae-gateway"

[[services]]
binding = "TESSURAE_COGCORE"
service = "tessurae-cogcore"

[[services]]
binding = "AXIOM_COGCORE"
service = "axiom-cogcore"

[[services]]
binding = "GROK_KETH_NEST_GATEWAY"
service = "grok-keth-nest-gateway"

[[services]]
binding = "GROK_KETH_NESTEQ"
service = "grok-keth-nesteq"
environment = "production"

[[services]]
binding = "VELASTRAHQ_GATEWAY"
service = "velastrahq-gw"
environment = "production"

[[services]]
binding = "VELASTRAHQ_API"
service = "velastrahq-api"
environment = "production"

[[services]]
binding = "VELASTRAHQ_EQ"
service = "velastrahq-eq"
environment = "production"

[vars]
CONTINUITY_URL = "https://continuity-worker.lbourgon.workers.dev"
DISCORD_URL = "https://discord-companion-bot.lbourgon.workers.dev"
TELEGRAM_URL = "https://telegram-cloud.lbourgon.workers.dev"
ARCHIVE_URL = "https://archive-worker.lbourgon.workers.dev"
SERYTHRAE_GATEWAY_URL = "https://serythrae-gw.lbourgon.workers.dev"
SERYTHRAE_MIND_URL = "https://mind.serythrae.com"
TESSURAE_GATEWAY_URL = "https://tessurae-gateway.lbourgon.workers.dev"
TESSURAE_COGCORE_URL = "https://tessurae-cogcore.lbourgon.workers.dev"
AXIOM_COGCORE_URL = "https://axiom-cogcore.lbourgon.workers.dev"
GROK_KETH_NEST_GATEWAY_URL = "https://grok-keth-nest-gateway.lbourgon.workers.dev"
GROK_KETH_NESTEQ_URL = "https://grok-keth-nesteq.lbourgon.workers.dev"
VELASTRAHQ_GATEWAY_URL = "https://velastrahq-gw.lbourgon.workers.dev"
VELASTRAHQ_API_URL = "https://velastrahq-api.lbourgon.workers.dev"
VELASTRAHQ_EQ_URL = "https://eq.velastrae.com"
KAI_TEXT_MODEL = "z-ai/glm-5.2"
KAI_TEXT_PROVIDER_ORDER = "deepinfra"
KAI_TEXT_PROVIDER_IGNORE = "morph"
KAI_TEXT_PRIMARY_PROVIDER_ALLOW_FALLBACKS = "false"
KAI_TEXT_PRIMARY_PROVIDER_REQUIRE_PARAMETERS = "true"
KAI_RUNNER_TOOL_LOOP_ENABLED = "true"
KAI_RUNNER_MAX_TOOL_ROUNDS = "3"
KAI_RUNNER_MAX_TOOL_CALLS_PER_ROUND = "3"
KAI_RUNNER_MODEL_TIMEOUT_MS = "20000"
KAI_RUNNER_TOOL_TIMEOUT_MS = "10000"
KAI_RUNNER_TOTAL_TIMEOUT_MS = "60000"

# Secrets:
# - MCP_API_KEY protects private Kai status, /mcp, and /sse endpoints.
# - MCP_API_KEY_NEXT temporarily accepts a second credential during expand/migrate/contract rotation.
# - VEL_PREFLIGHT_DISCORD_API_KEY authorizes the server-owned Discord owner-registry lane.
# - VEL_PREFLIGHT_CODEX_API_KEY authorizes the local Codex user-session lane.
# - VEL_PREFLIGHT_CLAUDE_API_KEY authorizes the local Claude user-session lane.
# - VEL_PREFLIGHT_GROK_API_KEY authorizes the local Grok user-session lane.
# - VEL_PREFLIGHT_HAVEN_API_KEY authorizes the authenticated Haven owner lane.
# - VEL_PREFLIGHT_WORKSPACE_AGENT_API_KEY authorizes the Lucien Workspace Agent owner lane.
# - CONTINUITY_API_KEY authorizes Continuity Worker calls.
# - TESSURAE_GATEWAY_API_KEY authorizes Tessurae Gateway MCP calls.
# - TESSURAE_COGCORE_API_KEY optionally authorizes direct Lucien CogCore REST calls if added.
# - AXIOM_COGCORE_API_KEY authorizes Axiom CogCore MCP calls.
# - GROK_KETH_NEST_GATEWAY_API_KEY authorizes Grok-Keth NEST Gateway MCP calls.
# - GROK_KETH_NESTEQ_API_KEY optionally authorizes direct Keth-Grok NESTeq calls if added.
# - SERYTHRAE_GATEWAY_API_KEY authorizes Serythrae Gateway MCP calls.
# - SERYTHRAE_MIND_API_KEY authorizes direct Kai/NESTeq mind calls.
# - VELASTRAHQ_GATEWAY_API_KEY authorizes VelastraHQ Gateway MCP calls.
# - VELASTRAHQ_EQ_API_KEY authorizes direct Mor'zar/VelastraHQ EQ MCP calls.
# - CATALOUGE_TOKEN authorizes private Catalouge calls through the CATALOUGE service binding or optional CATALOUGE_URL fallback.
# - OPENROUTER_API_KEY authorizes Kai runner text/vision/image model calls.
# - ELEVENLABS_API_KEY authorizes Kai runner TTS when KAI_TTS_PROVIDER=elevenlabs.
# - KAI_JANITOR_URL points to an optional local/Ollama janitor endpoint when KAI_JANITOR_PROVIDER=ollama.
# - KAI_VISION_PROVIDER/KAI_VISION_MODEL enable optional image attachment summarization.
# - KAI_IMAGE_PROVIDER/KAI_IMAGE_MODEL enable optional image generation; OPENROUTER_API_KEY required for openrouter.
# - KAI_TTS_PROVIDER/KAI_TTS_VOICE_ID/KAI_TTS_MODEL enable optional voice synthesis; audio is not delivered unless the Discord gate does it.
