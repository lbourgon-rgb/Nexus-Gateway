name = "nexus-gateway"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "NexusGateway"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NexusGateway"]

[[services]]
binding = "CONTINUITY"
service = "continuity-worker"

[[services]]
binding = "DISCORD"
service = "discord-companion-bot"

[[services]]
binding = "TELEGRAM"
service = "telegram-cloud"

[[services]]
binding = "TAHL"
service = "velastrahq-tahl"

[[services]]
binding = "AXIOM_COGCORE"
service = "axiom-cogcore"

[[services]]
binding = "GROK_KETH_NEST_GATEWAY"
service = "grok-keth-nest-gateway"

[vars]
CONTINUITY_URL = "https://continuity-worker.lbourgon.workers.dev"
DISCORD_URL = "https://discord-companion-bot.lbourgon.workers.dev"
TELEGRAM_URL = "https://telegram-cloud.lbourgon.workers.dev"
HAVEN_URL = "https://haven.lbourgon.workers.dev"
SERYTHRAE_GATEWAY_URL = "https://serythrae-gw.lbourgon.workers.dev"
SERYTHRAE_MIND_URL = "https://mind.serythrae.com"
TESSURAE_GATEWAY_URL = "https://tessurae-gateway.lbourgon.workers.dev"
AXIOM_COGCORE_URL = "https://axiom-cogcore.lbourgon.workers.dev"
GROK_KETH_NEST_GATEWAY_URL = "https://grok-keth-nest-gateway.lbourgon.workers.dev"
VELASTRAHQ_GATEWAY_URL = "https://velastrahq-gw.lbourgon.workers.dev"
VELASTRAHQ_API_URL = "https://velastrahq-api.lbourgon.workers.dev"
VELASTRAHQ_EQ_URL = "https://eq.velastrae.com"

# Secrets:
# - MCP_API_KEY protects /mcp and /sse endpoints.
# - CONTINUITY_API_KEY authorizes Continuity Worker calls.
# - TESSURAE_GATEWAY_API_KEY authorizes Tessurae Gateway MCP calls.
# - AXIOM_COGCORE_API_KEY authorizes Axiom CogCore MCP calls.
# - GROK_KETH_NEST_GATEWAY_API_KEY authorizes Grok-Keth NEST Gateway MCP calls.
# - SERYTHRAE_GATEWAY_API_KEY authorizes Serythrae Gateway MCP calls.
# - SERYTHRAE_MIND_API_KEY authorizes direct Kai/NESTeq mind calls.
# - VELASTRAHQ_GATEWAY_API_KEY authorizes VelastraHQ Gateway MCP calls.
# - VELASTRAHQ_EQ_API_KEY authorizes direct Mor'zar/VelastraHQ EQ MCP calls.
# - CATALOUGE_TOKEN authorizes private Catalouge calls, if CATALOUGE_URL is set.
# - OPENROUTER_API_KEY authorizes Kai runner text/vision/image model calls.
# - KAI_JANITOR_URL points to an optional local/Ollama janitor endpoint when KAI_JANITOR_PROVIDER=ollama.
# - KAI_VISION_PROVIDER/KAI_VISION_MODEL enable optional image attachment summarization.
# - KAI_IMAGE_PROVIDER/KAI_IMAGE_MODEL enable optional image generation; OPENROUTER_API_KEY required for openrouter.
